name: Docker (unstable)

# Every push to main is an "unstable" build: publishes the Lorentz daemon
# (root Dockerfile, web UI embedded - see README.md, "Web UI") as
# ghcr.io/<repo>:unstable, replacing whatever main last pointed to, then
# deletes the version that tag used to point to. A version tag (release.yml)
# is the stable, versioned counterpart of this image.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/docker-unstable.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c #v4.2.0

      # Pull requests build the image to catch a broken Dockerfile, but never
      # push - only a real push to main publishes the unstable tag.
      - name: Log in to GitHub Packages
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # github.repository is "geovannyAvelar/lorentz" (mixed case); a raw
      # image tag with it would fail (Docker requires a lowercase
      # repository name) - metadata-action normalizes it for us.
      - name: Derive image tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=unstable

      # provenance/sbom off: buildx otherwise pushes an image *index*
      # referencing the real image plus a separate attestation manifest.
      # GHCR considers that attestation manifest untagged (only the index
      # carries "unstable"), so the cleanup job below deletes it as garbage
      # - which breaks the tag even though it still "exists", since the
      # content it points to is now gone. A plain single manifest has
      # nothing untagged left for cleanup to touch.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=lorentz-unstable
          cache-to: type=gha,mode=max,scope=lorentz-unstable

  cleanup:
    name: remove the previous unstable image
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Re-pushing the "unstable" tag above moved it to the new image and
      # left the one it used to point to dangling (untagged) in the
      # registry - version tags from release.yml are never untagged, so
      # this can only ever delete old unstable builds, never a release.
      # (provenance/sbom are off in the build step above so the *current*
      # image itself never shows up here as an untagged attestation
      # manifest - that was the actual cause of a broken "unstable" pull.)
      #
      # min-versions-to-keep is 1, not 0: it costs one extra generation of
      # storage but means a client that pulled "unstable" and cached that
      # digest moments before this run (Portainer/compose digest-pinning
      # does this) still finds it for one more cycle instead of an instant 404.
      #
      # Needs the ghcr.io/<repo>/lorentz package's "Manage Actions access"
      # (in its GitHub Packages settings) to list this repository with the
      # Admin role - GITHUB_TOKEN cannot delete package versions otherwise.
      - name: Delete old untagged unstable versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: lorentz
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 1
