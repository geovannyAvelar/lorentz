name: Release

# A version tag (vX.Y.Z) builds the Lorentz daemon (root Dockerfile, web UI
# embedded - see README.md, "Web UI"), publishes it to GitHub Packages
# tagged with that version (and as "latest"), and creates the matching
# GitHub Release. The rolling, unversioned counterpart of this image is
# ghcr.io/<repo>:unstable, built from main on every push (docker-unstable.yml).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  docker:
    name: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c #v4.2.0

      - name: Log in to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # See docker-unstable.yml for why provenance/sbom are off: without it,
      # buildx pushes an image index plus a separate attestation manifest,
      # which GHCR's package-version listing treats as its own, untagged
      # entry - a hazard if a cleanup step is ever added here too.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=lorentz-release
          cache-to: type=gha,mode=max,scope=lorentz-release

  release:
    name: github release
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          fetch-depth: 0

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
